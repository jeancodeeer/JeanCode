name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web modules
        run: for f in web/js/*.js; do node --input-type=module --check < "$f"; done
      - name: desktop
        run: for f in desktop/main.js desktop/preload.js desktop/lib/*.js; do node --check "$f"; done
