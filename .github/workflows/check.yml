name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web modules
        run: for f in web/js/*.js; do node --input-type=module --check < "$f"; done
      - name: desktop
        run: for f in desktop/main.js desktop/preload.js desktop/lib/*.js; do node --check "$f"; done
      - name: single version
        run: node scripts/version.mjs
      - name: desktop dependencies
        # algunas pruebas cargan módulos del escritorio (ws); sin scripts: no hace falta descargar Electron
        run: npm ci --ignore-scripts
        working-directory: desktop
      - name: unit tests
        run: node --test tests/unit.test.mjs

  pygame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame-ce
      - name: pygame client (headless)
        run: python -m unittest discover -s pygame/tests -v
        env:
          SDL_VIDEODRIVER: dummy
