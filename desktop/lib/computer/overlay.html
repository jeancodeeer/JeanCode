<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>JeanCode controla el equipo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 600 12px/1 Consolas, 'IBM Plex Mono', monospace; color: #f2f1ec; -webkit-user-select: none; user-select: none; }
  .bar { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 8px 0 12px; background: #000; border: 1px solid #f2f1ec; box-sizing: border-box; }
  .dot { width: 8px; height: 8px; background: #ff8a80; flex: none; animation: blink 1.2s steps(2) infinite; }
  .paused .dot { background: #a3a29b; animation: none; }
  .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .04em; }
  .key { color: #7f7e78; flex: none; }
  button { flex: none; height: 26px; padding: 0 10px; border: 1px solid #f2f1ec; background: transparent; color: #f2f1ec; font: inherit; letter-spacing: .1em; cursor: pointer; }
  button.stop { background: #f2f1ec; color: #000; }
  button:hover { background: #fff; color: #000; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="dot"></span>
    <span class="txt" id="txt">JEANCODE CONTROLA EL EQUIPO</span>
    <span class="key">CTRL+ALT+Q</span>
    <button id="pause" type="button">PAUSAR</button>
    <button id="stop" class="stop" type="button">DETENER</button>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
